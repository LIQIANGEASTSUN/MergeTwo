//开仓库格子
message TwoMergeOpenGridRequest {
	optional string cfgId = 1;
}

//开仓库格子相应
message TwoMergeOpenGridResponse {
}

//同步本次二合活动消耗得体力之和请求
message TwoMergeCostEnergyRequest {
	optional string cfgId = 1;
	optional int32 num = 2;
}

//同步本次二合活动消耗得体力之和响应
message TwoMergeCostEnergyResponse {
	
}

//请求交付支线订单(仅针对支线二合订单) 服务器此处会直接读取对应的奖励直接发放
message TwoMergeSubmitOrderRequest {
	optional string cfgId = 1;
	//配置订单id或自定义随机订单id
	optional string orderId = 2;
	//扣除对应道具后的格子状态(这里不用position来处理的原因就是担心道具有多个 不能直接把格子置空处理，应该是物品数量减1)
	repeated GridInfo gridInfos = 3;
	//使用的二合待使用道具(在待使用列表中删掉对应的道具)
	repeated string waitItems = 4;
	//订单类型 0:策划配置表配置订单(FA第一版)  1:自定义随机订单类型 2:策划配置的固定订单类型(配置表OrderItemSetTemplate)
 	optional int32 orderType = 5;
	//自定义类型订单 同步一下自定义订单的cd结束时间戳 无需同步的情况可以传0
	optional int64 endTime = 6;
}

//请求交付支线订单(仅针对支线二合订单)响应
message TwoMergeSubmitOrderResponse {
	//特殊订单组cd设置为0 (针对于配置订单的返回结果)
	optional int32 groupId = 1;
	//对于自定义随机订单或者OrderItemSetTemplate配置的奖励道具集合
	repeated ItemMsg items = 2;
}

//请求商店信息
message TwoMergeShopInfoRequest {
	optional string cfgId = 1;
}

//商品信息
message ShopItem {
	//位置 从1开始
	optional int32 position = 1;
	//MergeTwoItemTemplate配置表中id
	optional string itemId = 2;
	//已购买次数(看广告或免费领取或者货币购买)
	optional int32 count = 3;
}

//每日商品信息
message DayShopItem {
	//商品信息
	optional ShopItem shopItem  = 1;
	//随机商品的随机索引值 从0开始
	optional int32 randomIndex = 2;
}

//请求商店信息响应
message TwoMergeShopInfoResponse {
	//每日商品集合
	repeated DayShopItem dayShopItems = 1;
	//热卖商品集合
	repeated ShopItem hotShopItems = 2;
	//热卖商品广告每日刷新已用次数
	optional int32 hotAdsCount = 3;
	//热卖商品钻石每日刷新已用次数
	optional int32 hotDiamondCount = 4;
	//上次每日商品刷新时间点
	optional int64 lastDayUpdateTime = 5;
	//上次热卖商品刷新时间点
	optional int64 lastHotUpdateTime = 6;
}

//请求购买商店商品
message TwoMergeShopBuyItemRequest {
	optional string cfgId = 1;
	//商店商品类型 1：每日特价商品 2 : 热卖商品
	optional int32 shopType = 2;
	//商品位置
	optional int32 position = 3;
}

//请求购买商店商品响应
message TwoMergeShopBuyItemResponse {
}

//请求刷新热卖商品
message TwoMergeShopRefreshHotItemRequest {
	optional string cfgId = 1;
	//1: 钻石刷新  2:广告刷新
	optional int32 refreshType = 2;
}

//请求刷新热卖商品响应
message TwoMergeShopRefreshHotItemResponse {
	//热卖商品集合
	repeated ShopItem hotShopItems = 1;
}

//请求存储活动二合引导数据
message TwoMergeGuideRequest {
	//二合棋盘的id
	optional string cfgId = 1;
	//二合引导信息
	optional GuideInfo guideInfo = 2;
}

//请求存储活动二合引导数据响应
message TwoMergeGuideResponse {
	
}

//请求刷新随机订单
message TwoMergeRandomOrderRequest {
	//二合棋盘的id
	optional string cfgId = 1;
	//随机订单信息
	optional RandomOrderInfo orderInfo = 2;
	//cd结束时间戳(不更新时间戳可以不传值)
	optional int64 endTime = 3;
}

//请求刷新随机订单响应
message TwoMergeRandomOrderResponse {
	
}


//更新随机订单结束时间(主要是针对简单订单)
message TwoMergeRandomOrderCDRequest {
	//二合棋盘的id
	optional string cfgId = 1;
	//cd结束时间戳
	optional int64 endTime = 2;
}

//更新随机订单结束时间(主要是针对简单订单)
message TwoMergeRandomOrderCDResponse {
	
}

//请求购买二合紫体力
message TwoMergeBuyPurpleEnergyRequest {
	//体力商店配置id
	optional string purpleShopCfgId = 1;
	//发送扣货币数量(如大于服务器数量 服务器报错， 主要用于校验)
	optional int32 cost = 2;
}
//请求购买二合紫体力响应
message TwoMergeBuyPurpleEnergyResponse {
}